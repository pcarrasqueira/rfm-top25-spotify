name: Comercial Live -> Spotify

run-name: "Comercial Live -> Spotify | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'agendado' }} @ ${{ github.run_started_at }}"

on:
  schedule:
    - cron: '24 * * * *'  # hora a hora, ao minuto :24
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr script
        env:
          SPOTIFY_CLIENT_ID:                  ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:              ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN:              ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_COMERCIAL_LIVE_PLAYLIST_ID: ${{ secrets.SPOTIFY_COMERCIAL_LIVE_PLAYLIST_ID }}
          GITHUB_STEP_SUMMARY:                ${{ runner.temp }}/summary.md
        run: python comercial_live_to_spotify.py

      - name: Publicar summary
        if: always()
        run: cat ${{ runner.temp }}/summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
