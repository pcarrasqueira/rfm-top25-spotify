name: RFM Top 25 -> Spotify

run-name: "RFM Top 25 -> Spotify | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'agendado' }} @ ${{ github.run_started_at }}"

on:
  schedule:
    - cron: '30 22 * * 0'  # Domingo 23:30 Lisboa (22:30 UTC verao)
    - cron: '0 9 * * 1'    # Segunda 10:00 Lisboa (09:00 UTC verao)
  workflow_dispatch:

concurrency:
  group: spotify-api
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar estado Spotify
        run: mkdir -p .cache/spotify

      - name: Restaurar estado Spotify
        uses: actions/cache/restore@v4
        with:
          path: .cache/spotify
          key: spotify-state-v2-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            spotify-state-v2-${{ github.repository }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID:   ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          GITHUB_STEP_SUMMARY:   ${{ runner.temp }}/summary.md
        run: python rfm_to_spotify.py

      - name: Publicar summary
        if: always()
        run: cat ${{ runner.temp }}/summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Guardar estado Spotify
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/spotify
          key: spotify-state-v2-${{ github.repository }}-${{ github.run_id }}
