name: Batida FM Live -> Spotify

run-name: "Batida FM Live -> Spotify | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'agendado' }} @ ${{ github.run_started_at }}"

on:
  schedule:
    - cron: '12 * * * *'  # hora a hora, ao minuto :12
  workflow_dispatch:

concurrency:
  group: spotify-api
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Preparar estado Spotify
        run: mkdir -p .cache/spotify

      - name: Restaurar estado Spotify
        uses: actions/cache/restore@v4
        with:
          path: .cache/spotify
          key: spotify-state-v2-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            spotify-state-v2-${{ github.repository }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr script
        env:
          SPOTIFY_CLIENT_ID:                ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:            ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN:            ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_BATIDA_LIVE_PLAYLIST_ID:  ${{ secrets.SPOTIFY_BATIDA_LIVE_PLAYLIST_ID }}
          GITHUB_STEP_SUMMARY:              ${{ runner.temp }}/summary.md
        run: python batida_live_to_spotify.py

      - name: Publicar summary
        if: always()
        run: cat ${{ runner.temp }}/summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Guardar estado Spotify
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/spotify
          key: spotify-state-v2-${{ github.repository }}-${{ github.run_id }}
