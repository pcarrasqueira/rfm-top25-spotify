name: Comercial TNT Top 20 -> Spotify

run-name: "Comercial TNT Top 20 -> Spotify | ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'agendado' }} @ ${{ github.run_started_at }}"

on:
  schedule:
    - cron: '30 22 * * 0'  # Domingo 23:30 Lisboa (22:30 UTC verao)
    - cron: '0 9 * * 1'    # Segunda 10:00 Lisboa (09:00 UTC verao)
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr script
        env:
          SPOTIFY_CLIENT_ID:             ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:         ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN:         ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_COMERCIAL_PLAYLIST_ID: ${{ secrets.SPOTIFY_COMERCIAL_PLAYLIST_ID }}
        run: python comercial_to_spotify.py
